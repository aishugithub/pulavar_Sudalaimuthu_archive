<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>புலவர் ச. சுடலைமுத்து — கவிதைகள்</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Catamaran:wght@400;600;700;800;900&family=Hind+Madurai:wght@300;400;500;600&family=Source+Serif+4:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>

/* ── Tokens ─────────────────────────────────────────── */
:root {
  --parchment:   #f7f1e3;
  --parchment-dk:#efe6d2;
  --white:       #ffffff;
  --ink:         #2b2420;
  --ink-soft:    #6b5f55;
  --maroon:      #7a2e2e;
  --maroon-deep: #5e2222;
  --maroon-pale: #f9eaea;
  --gold:        #c9a648;
  --gold-pale:   #fdf6e3;
  --teal:        #1f4e4e;
  --teal-soft:   #d8e6e3;
  --line:        #e2d8c4;
  --shadow-sm:   0 1px 4px rgba(43,36,32,0.08);
  --shadow-md:   0 4px 18px rgba(43,36,32,0.11);
  --shadow-lg:   0 8px 36px rgba(43,36,32,0.14);
}

/* ── Reset ──────────────────────────────────────────── */
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html { -webkit-text-size-adjust:100%; scroll-behavior:smooth; }
body {
  font-family:'Hind Madurai', sans-serif;
  background: var(--parchment);
  color: var(--ink);
  line-height: 1.7;
  overflow-x: hidden;
}

/* ── Header ─────────────────────────────────────────── */
header {
  background: linear-gradient(160deg, var(--maroon-deep) 0%, #8b3636 100%);
  color: var(--parchment);
  text-align: center;
  padding: 48px 20px 40px;
  position: relative;
  overflow: hidden;
}

/* subtle decorative rings */
header::before, header::after {
  content:'';
  position:absolute;
  border-radius:50%;
  opacity:0.07;
  background: var(--gold);
}
header::before { width:340px; height:340px; top:-120px; right:-80px; }
header::after  { width:240px; height:240px; bottom:-100px; left:-60px; }

.eyebrow {
  font-family:'Source Serif 4', serif;
  font-style:italic;
  font-size:12px;
  letter-spacing:0.22em;
  text-transform:uppercase;
  color: var(--gold);
  margin-bottom:14px;
  position:relative;
}

h1 {
  font-family:'Catamaran', sans-serif;
  font-weight:900;
  font-size: clamp(26px, 8vw, 62px);
  line-height:1.1;
  color: #fff;
  letter-spacing:-0.01em;
  position:relative;
}

.subtitle {
  font-family:'Hind Madurai', sans-serif;
  font-weight:300;
  font-size:15px;
  color:rgba(247,241,227,0.75);
  margin-top:10px;
  position:relative;
}

.gold-rule {
  width:60px;
  height:3px;
  background: var(--gold);
  border-radius:2px;
  margin:20px auto 0;
  position:relative;
  opacity:0.8;
}

.poem-counter {
  display:inline-block;
  margin-top:18px;
  background:rgba(255,255,255,0.12);
  color:rgba(247,241,227,0.9);
  font-size:13px;
  font-weight:500;
  padding:5px 16px;
  border-radius:999px;
  letter-spacing:0.04em;
  position:relative;
}

/* ── Filter bar ─────────────────────────────────────── */
.filter-bar-wrap {
  position:sticky;
  top:0;
  z-index:50;
  background:var(--parchment);
  border-bottom:1px solid var(--line);
  box-shadow: var(--shadow-sm);
}

.filter-bar {
  display:flex;
  gap:8px;
  padding:12px 16px;
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
  flex-wrap:nowrap;         /* horizontal scroll on mobile */
}
.filter-bar::-webkit-scrollbar { display:none; }

.filter-chip {
  font-family:'Hind Madurai', sans-serif;
  font-size:14px;
  font-weight:600;
  padding:7px 18px;
  border-radius:999px;
  border:1.5px solid var(--line);
  background:var(--white);
  color:var(--ink-soft);
  cursor:pointer;
  white-space:nowrap;
  flex-shrink:0;
  transition:all 0.18s ease;
  -webkit-tap-highlight-color:transparent;
}
.filter-chip:hover  { border-color:var(--maroon); color:var(--maroon); }
.filter-chip.active { background:var(--maroon); color:#fff; border-color:var(--maroon); }

/* ── Poem list ──────────────────────────────────────── */
main {
  max-width:680px;
  margin:0 auto;
  padding:20px 14px 80px;
  display:flex;
  flex-direction:column;
  gap:16px;
}

/* ── Poem card ──────────────────────────────────────── */
.poem-card {
  background:var(--white);
  border-radius:18px;
  box-shadow:var(--shadow-md);
  overflow:hidden;
  border:1px solid var(--line);
  transition:box-shadow 0.2s ease, transform 0.2s ease;
}
.poem-card:active { transform:scale(0.99); box-shadow:var(--shadow-sm); }

.card-top {
  padding:18px 18px 0;
}

/* category + date row */
.poem-meta-row {
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:8px;
  margin-bottom:10px;
}

.poem-category {
  font-size:11px;
  font-weight:700;
  letter-spacing:0.06em;
  text-transform:uppercase;
  padding:3px 11px;
  border-radius:999px;
  background:var(--teal-soft);
  color:var(--teal);
}

.poem-date {
  font-family:'Source Serif 4', serif;
  font-style:italic;
  font-size:13px;
  color:var(--ink-soft);
}

.poem-title {
  font-family:'Catamaran', sans-serif;
  font-weight:800;
  font-size:22px;
  color:var(--maroon-deep);
  line-height:1.25;
  margin-bottom:14px;
}

/* gold accent line before poem text */
.poem-body {
  padding:0 18px 4px;
  border-left:3px solid var(--gold);
  margin:0 18px 16px;
}

.poem-text {
  font-family:'Hind Madurai', sans-serif;
  font-size:17px;
  line-height:2.05;
  color:var(--ink);
  white-space:pre-line;
}

/* footer meta: author, occasion, dedicated */
.poem-footer {
  background:var(--parchment);
  border-top:1px solid var(--line);
  padding:12px 18px;
  display:flex;
  flex-direction:column;
  gap:4px;
}

.meta-item {
  font-family:'Hind Madurai', sans-serif;
  font-size:13px;
  color:var(--ink-soft);
  display:flex;
  gap:6px;
  align-items:baseline;
  flex-wrap:wrap;
}
.meta-item strong {
  font-weight:600;
  color:var(--ink);
  white-space:nowrap;
}

/* PDF button */
.download-btn {
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  width:calc(100% - 36px);
  margin:12px 18px 16px;
  padding:12px 0;
  background:var(--maroon-pale);
  color:var(--maroon);
  border:1.5px solid var(--maroon);
  border-radius:10px;
  font-family:'Hind Madurai', sans-serif;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
  transition:all 0.18s ease;
  -webkit-tap-highlight-color:transparent;
  min-height:46px;  /* comfortable tap target */
}
.download-btn:hover   { background:var(--maroon); color:#fff; }
.download-btn:disabled{ opacity:0.55; cursor:wait; }
.download-btn svg { width:16px; height:16px; flex-shrink:0; }

/* ── Empty / Loading ─────────────────────────────────── */
.state-msg {
  text-align:center;
  padding:72px 24px;
  font-family:'Source Serif 4', serif;
  font-style:italic;
  font-size:17px;
  color:var(--ink-soft);
}

/* ── Footer ─────────────────────────────────────────── */
footer {
  text-align:center;
  padding:28px 20px 48px;
  border-top:1px solid var(--line);
  font-family:'Source Serif 4', serif;
  font-style:italic;
  font-size:13px;
  color:var(--ink-soft);
}

/* ── PDF hidden render area ──────────────────────────── */
#pdf-render-area {
  position:fixed; top:-99999px; left:-99999px;
  width:720px;
  background:#fdf8ef;
  padding:56px 60px;
  box-sizing:border-box;
}
.pdf-divider {
  width:220px; height:12px; margin:0 auto 36px;
  background:repeating-linear-gradient(to right,var(--gold) 0,var(--gold) 2px,transparent 2px,transparent 9px);
  opacity:0.55;
}
.pdf-title {
  font-family:'Catamaran',sans-serif; font-weight:800; font-size:30px;
  color:var(--maroon-deep); text-align:center; margin-bottom:32px; white-space:nowrap;
}
.pdf-poem-text {
  font-family:'Hind Madurai',sans-serif; font-size:19px; line-height:2.05;
  color:var(--ink); white-space:pre; text-align:center; margin-bottom:44px;
}
.pdf-signature {
  text-align:right; font-family:'Catamaran',sans-serif; font-weight:700; font-size:17px;
  color:var(--maroon-deep); border-top:1px solid #e6d9bd; padding-top:18px;
}
.pdf-signature .pdf-date {
  font-family:'Source Serif 4',serif; font-style:italic; font-weight:400;
  font-size:14px; color:var(--ink-soft); margin-top:4px;
}

/* ── Desktop enhancements ────────────────────────────── */
@media (min-width:640px) {
  header          { padding:64px 40px 52px; }
  h1              { font-size:clamp(40px,6vw,64px); }
  .filter-bar     { flex-wrap:wrap; justify-content:center; overflow-x:visible; padding:14px 24px; }
  main            { padding:28px 24px 100px; gap:20px; }
  .poem-title     { font-size:26px; }
  .poem-text      { font-size:18px; }
  .card-top       { padding:24px 24px 0; }
  .poem-body      { margin:0 24px 20px; }
  .poem-footer    { padding:14px 24px; gap:6px; }
  .download-btn   { width:calc(100% - 48px); margin:14px 24px 20px; }
}
</style>
</head>
<body>

<!-- ══════════════ HEADER ══════════════ -->
<header>
  <div class="eyebrow">An Archive of Verse</div>
  <h1>புலவர் ச. சுடலைமுத்து</h1>
  <p class="subtitle">கவிதைகள் — ஒரு வாழ்நாள் படைப்புகள்</p>
  <div class="gold-rule"></div>
  <div class="poem-counter" id="poem-counter" style="display:none;"></div>
</header>

<!-- ══════════════ FILTER BAR ══════════════ -->
<div class="filter-bar-wrap">
  <div class="filter-bar" id="filters">
    <button class="filter-chip active" data-category="all">அனைத்தும்</button>
  </div>
</div>

<!-- ══════════════ POEM LIST ══════════════ -->
<main id="poem-list">
  <div class="state-msg" id="state-msg">கவிதைகள் ஏற்றப்படுகின்றன…</div>
</main>

<!-- ══════════════ FOOTER ══════════════ -->
<footer>
  <p>புலவர் ச. சுடலைமுத்து அவர்களின் கவிதைகளின் காப்பகம்</p>
</footer>

<!-- ══════════════ HIDDEN PDF AREA ══════════════ -->
<div id="pdf-render-area">
  <div class="pdf-divider"></div>
  <div class="pdf-title" id="pdf-title" style="display:none;"></div>
  <div class="pdf-poem-text" id="pdf-poem-text"></div>
  <div class="pdf-signature">
    <div id="pdf-author"></div>
    <div class="pdf-date" id="pdf-date"></div>
  </div>
</div>

<script>
  const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSzZaFgvBmSlwwXuX5uwXH0IK3bHF0-T4VE0YXnGvklAxQpiG1IY6EPBgL8O73VUAoAf-HT5iawdohs/pub?gid=1470005638&single=true&output=csv";

  /* ── CSV parser ── */
  function parseCSV(text) {
    const rows = [];
    let row = [], field = '', inQuotes = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (inQuotes) {
        if (c === '"') {
          if (text[i+1] === '"') { field += '"'; i++; }
          else inQuotes = false;
        } else field += c;
      } else {
        if (c === '"') inQuotes = true;
        else if (c === ',') { row.push(field); field = ''; }
        else if (c === '\n' || c === '\r') {
          if (c === '\r' && text[i+1] === '\n') i++;
          row.push(field); field = '';
          if (row.some(x => x.trim() !== '')) rows.push(row);
          row = [];
        } else field += c;
      }
    }
    if (field !== '' || row.length) { row.push(field); rows.push(row); }
    return rows;
  }

  /* ── Date helpers ── */
  function parseDate(d) {
    if (!d) return null;
    d = d.trim();
    // Google Forms: M/D/YYYY
    const m = d.match(/^(\d{1,2})[-.\/](\d{1,2})[-.\/](\d{2,4})$/);
    if (m) {
      let [, mm, dd, yyyy] = m;
      if (yyyy.length === 2) yyyy = '20' + yyyy;
      const p = new Date(`${yyyy}-${mm.padStart(2,'0')}-${dd.padStart(2,'0')}`);
      return isNaN(p) ? null : p;
    }
    const p = new Date(d);
    return isNaN(p) ? null : p;
  }

  function formatDate(dateObj, raw) {
    if (!dateObj) return raw || '';
    const months = ['ஜனவரி','பிப்ரவரி','மார்ச்','ஏப்ரல்','மே','ஜூன்','ஜூலை','ஆகஸ்ட்','செப்டம்பர்','அக்டோபர்','நவம்பர்','டிசம்பர்'];
    return `${dateObj.getDate()} ${months[dateObj.getMonth()]} ${dateObj.getFullYear()}`;
  }

  function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str || '';
    return d.innerHTML;
  }

  /* ── Main load ── */
  async function loadPoems() {
    const listEl = document.getElementById('poem-list');
    try {
      const res = await fetch(SHEET_CSV_URL);
      if (!res.ok) throw new Error('இணைப்பு தோல்வி');
      const text = await res.text();
      const rows = parseCSV(text);
      if (rows.length < 2) throw new Error('தகவல் இல்லை');

      /* flexible bilingual header matching */
      const rawHeaders = rows[0];
      function col(keywords) {
        for (let i = 0; i < rawHeaders.length; i++) {
          const h = (rawHeaders[i] || '').toLowerCase();
          if (keywords.some(k => h.includes(k))) return i;
        }
        return -1;
      }
      const idx = {
        title:       col(['title',    'தலைப்பு']),
        poem:        col(['poem',     'கவிதை']),
        occasion:    col(['occasion', 'நிகழ்வு']),
        dedicatedto: col(['dedicated','சமர்ப்பணம்']),
        date:        col(['date',     'தேதி']),
        category:    col(['categor',  'வகை']),
        author:      col(['author',   'ஆசிரியர்']),
      };

      let poems = rows.slice(1)
        .filter(r => r[idx.poem] && r[idx.poem].trim())
        .map((r, originalIndex) => ({
          title:       idx.title       >= 0 ? (r[idx.title]       || '').trim() : '',
          poem:        idx.poem        >= 0 ? (r[idx.poem]        || '').trim() : '',
          occasion:    idx.occasion    >= 0 ? (r[idx.occasion]    || '').trim() : '',
          dedicatedTo: idx.dedicatedto >= 0 ? (r[idx.dedicatedto] || '').trim() : '',
          dateRaw:     idx.date        >= 0 ? (r[idx.date]        || '').trim() : '',
          category:    idx.category    >= 0 ? (r[idx.category]    || '').trim() : '',
          author:      idx.author      >= 0 ? (r[idx.author]      || '').trim() : '',
          originalIndex,
        }));

      poems.forEach(p => p.dateObj = parseDate(p.dateRaw));
      // newest submission first (bottom of sheet → top of page)
      poems.sort((a, b) => b.originalIndex - a.originalIndex);

      /* counter badge */
      const counter = document.getElementById('poem-counter');
      counter.textContent = poems.length + ' கவிதைகள்';
      counter.style.display = 'inline-block';

      /* category filter chips */
      const cats = [...new Set(poems.map(p => p.category).filter(Boolean))];
      const filterBar = document.getElementById('filters');
      cats.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = 'filter-chip';
        btn.dataset.category = cat;
        btn.textContent = cat;
        filterBar.appendChild(btn);
      });

      filterBar.addEventListener('click', e => {
        if (!e.target.classList.contains('filter-chip')) return;
        document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
        e.target.classList.add('active');
        render(e.target.dataset.category);
      });

      /* render */
      function render(filter) {
        const filtered = filter === 'all' ? poems : poems.filter(p => p.category === filter);
        if (!filtered.length) {
          listEl.innerHTML = '<div class="state-msg">இந்தப் பகுப்பில் கவிதைகள் இல்லை.</div>';
          return;
        }
        window.__currentFiltered = filtered;
        listEl.innerHTML = filtered.map((p, i) => `
          <div class="poem-card">
            <div class="card-top">
              <div class="poem-meta-row">
                ${p.category ? `<span class="poem-category">${escapeHtml(p.category)}</span>` : ''}
                ${p.dateObj || p.dateRaw ? `<span class="poem-date">${escapeHtml(formatDate(p.dateObj, p.dateRaw))}</span>` : ''}
              </div>
              ${p.title ? `<div class="poem-title">${escapeHtml(p.title)}</div>` : ''}
            </div>
            <div class="poem-body">
              <div class="poem-text">${escapeHtml(p.poem)}</div>
            </div>
            ${(p.author || p.dedicatedTo || p.occasion) ? `
            <div class="poem-footer">
              ${p.author      ? `<div class="meta-item"><strong>ஆசிரியர்:</strong> ${escapeHtml(p.author)}</div>` : ''}
              ${p.occasion    ? `<div class="meta-item"><strong>நிகழ்வு:</strong> ${escapeHtml(p.occasion)}</div>` : ''}
              ${p.dedicatedTo ? `<div class="meta-item"><strong>சமர்ப்பணம்:</strong> ${escapeHtml(p.dedicatedTo)}</div>` : ''}
            </div>` : ''}
            <button class="download-btn" data-index="${i}">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
              PDF பதிவிறக்கம்
            </button>
          </div>`).join('');
      }

      render('all');

      /* PDF handler */
      listEl.addEventListener('click', async e => {
        const btn = e.target.closest('.download-btn');
        if (!btn) return;
        await downloadPoemPDF(window.__currentFiltered[+btn.dataset.index], btn);
      });

    } catch (err) {
      console.error(err);
      listEl.innerHTML = `<div class="state-msg">கவிதைகளை ஏற்ற முடியவில்லை.<br><small style="font-style:normal;font-size:13px;opacity:0.7;">${escapeHtml(err.message)}</small></div>`;
    }
  }

  /* ── PDF generation ── */
  async function downloadPoemPDF(p, btn) {
    const origHTML = btn.innerHTML;
    btn.disabled = true;
    btn.textContent = 'தயாராகிறது…';
    try {
      const titleEl  = document.getElementById('pdf-title');
      const poemEl   = document.getElementById('pdf-poem-text');
      const authorEl = document.getElementById('pdf-author');
      const dateEl   = document.getElementById('pdf-date');
      const area     = document.getElementById('pdf-render-area');

      if (p.title) { titleEl.textContent = p.title; titleEl.style.display = 'block'; }
      else           titleEl.style.display = 'none';
      poemEl.textContent   = p.poem;
      authorEl.textContent = p.author || '';
      dateEl.textContent   = (p.dateObj || p.dateRaw) ? formatDate(p.dateObj, p.dateRaw) : '';

      if (document.fonts?.ready) await document.fonts.ready;
      await new Promise(r => setTimeout(r, 80));

      const availableWidth = area.clientWidth - 120;
      let fontSize = 19;
      poemEl.style.fontSize = fontSize + 'px';

      const measurer = document.createElement('span');
      Object.assign(measurer.style, {visibility:'hidden',position:'absolute',whiteSpace:'pre',fontFamily:"'Hind Madurai',sans-serif"});
      document.body.appendChild(measurer);

      const lines = p.poem.split('\n');
      function measureMax(size) {
        measurer.style.fontSize = size + 'px';
        let max = 0;
        for (const line of lines) { measurer.textContent = line||' '; max = Math.max(max, measurer.offsetWidth); }
        return max;
      }
      let mw = measureMax(fontSize);
      while (mw > availableWidth && fontSize > 11) { fontSize -= 0.5; mw = measureMax(fontSize); }
      document.body.removeChild(measurer);
      poemEl.style.fontSize = fontSize + 'px';

      const canvas = await html2canvas(area, {scale:2, backgroundColor:'#fdf8ef', useCORS:true});
      const imgData = canvas.toDataURL('image/jpeg', 0.95);
      const { jsPDF } = window.jspdf;
      const pdfW = 595.28;
      const pdfH = (canvas.height * pdfW) / canvas.width;
      const pdf = new jsPDF({orientation: pdfH > pdfW ? 'portrait':'landscape', unit:'pt', format:[pdfW,pdfH]});
      pdf.addImage(imgData, 'JPEG', 0, 0, pdfW, pdfH);
      const fname = (p.title||'poem').trim().replace(/[^\u0B80-\u0BFFa-zA-Z0-9]+/g,'_').slice(0,40);
      pdf.save(`${fname||'poem'}.pdf`);

    } catch (err) {
      console.error('PDF error:', err);
      alert('PDF உருவாக்குவதில் சிக்கல். மீண்டும் முயற்சிக்கவும்.');
    } finally {
      btn.disabled = false;
      btn.innerHTML = origHTML;
      document.getElementById('pdf-poem-text').style.fontSize = '';
    }
  }

  loadPoems();
</script>
</body>
</html>
